[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-evaluation-lab"
version = "0.1.0"
description = "Portable, procedurally sealed analytics-agent evaluation"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.20,<5", "duckdb>=1.1,<2", "cryptography>=43,<47"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.11,<3", "types-jsonschema"]
snowflake = ["snowflake-connector-python>=3.12,<5"]
visuals = ["matplotlib>=3.8,<4", "numpy>=1.26,<2.5"]

[project.scripts]
agent-lab = "evaluation.cli:main"

[tool.setuptools.packages.find]
include = ["evaluation*", "platforms*"]

[tool.setuptools.package-data]
evaluation = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["evaluation", "platforms"]

[[tool.mypy.overrides]]
module = ["jsonschema"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["snowflake", "snowflake.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.ruff.lint.per-file-ignores]
"scripts/build_synthetic_fixture.py" = ["E501"]
